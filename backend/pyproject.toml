[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mathassistant"
version = "0.1.0"
description = "Local, math-only Socratic tutor (bring your own AI key)."
license = "MIT"
requires-python = ">=3.12"
# Every dependency is MIT-compatible (spec §3.2). License noted per line.
dependencies = [
    "fastapi>=0.115",         # MIT
    "uvicorn>=0.30",          # BSD-3
    "sympy>=1.13",            # BSD-3
    "lark>=1.2",              # MIT  (SymPy's LaTeX parser backend)
    "anthropic>=1.0",         # MIT
    "keyring>=25",            # MIT
    "platformdirs>=4",        # MIT
    "python-dotenv>=1",       # BSD-3 (dev-mode .env only)
    "pydantic>=2",            # MIT
]

[project.optional-dependencies]
dev = [
    "pytest>=8",              # MIT
    "httpx>=0.27",            # BSD-3 (FastAPI TestClient)
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mathassistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls the real AI provider (needs a key; run explicitly with -m live)",
    "keyring: touches the real OS credential store (uses a separate test service name)",
]
addopts = "-m 'not live'"
